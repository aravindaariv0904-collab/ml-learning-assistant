name: 30-Day Automated ML Daily Learning Runner

on:
  schedule:
    # 3:00 PM IST = 9:30 AM UTC (IST is UTC+5:30)
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Target Curriculum Day (1-30). Leave empty for state-managed progression.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Execute locally without calling cloud APIs'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'daily-ml-runner'
  cancel-in-progress: false

jobs:
  run-daily-ml-sprint:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Machine Learning Orchestrator
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL || '#ml-learning' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'google/gemini-2.0-flash-exp:free' }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GMAIL_DELEGATED_USER: ${{ secrets.GMAIL_DELEGATED_USER }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID || 'primary' }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          CMD="python orchestrator.py"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ -n "${{ inputs.day }}" ]; then
            CMD="$CMD --day ${{ inputs.day }}"
          fi
          echo "Running command: $CMD"
          $CMD

      - name: Persist Generated Artifacts & State Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage state updates (dist artifacts are uploaded as artifacts and synced to Google Drive)
          git add state.json
          
          if git diff --staged --quiet; then
            echo "No state or artifact modifications to commit."
          else
            git commit -m "Auto: Update daily ML learning state & artifacts [skip ci]"
            # Rebase and push to avoid race conditions
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD
          fi

      - name: Upload Daily Delivery Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-ml-artifacts
          path: |
            dist_html/
            dist_pptx/
            dist_notes/
            state.json
          retention-days: 14
